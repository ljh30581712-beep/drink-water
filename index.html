<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HydroCheck · AI 음수 인증 시스템</title>
<meta name="description" content="AI Vision으로 실제 음수 행동을 검증하는 산업 현장 근로자용 수분 섭취 관제 시스템 (NAVER OGQ마켓 AI Competition 출품작)">
<meta property="og:title" content="HydroCheck · AI 음수 인증 시스템">
<meta property="og:description" content="정해진 시간에 알람이 울리고, 실제로 물 마시는 모습을 AI가 판별해야 알람이 꺼집니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A7%3C/text%3E%3C/svg%3E">
<meta name="theme-color" id="themeColorMeta" content="#0D1319">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0D1319;
    --panel: #141C24;
    --panel-2: #1B2530;
    --line: #263241;
    --teal: #5EEAD4;
    --teal-dim: #2C7A6E;
    --amber: #FBBF24;
    --red: #F87171;
    --text: #E7EEF3;
    --text-dim: #7C8CA0;
  }
  body.light{
    --bg: #F4F7F8;
    --panel: #FFFFFF;
    --panel-2: #EEF3F5;
    --line: #DCE4E9;
    --teal: #0E9C8C;
    --teal-dim: #BFEAE3;
    --amber: #D97706;
    --red: #DC2626;
    --text: #16222A;
    --text-dim: #64768A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(circle at 20% -10%, #16202C 0%, transparent 45%),
      radial-gradient(circle at 100% 110%, #142027 0%, transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 28px 16px 60px;
    transition: background-color .25s ease, color .25s ease;
  }
  body.light{
    background:
      radial-gradient(circle at 20% -10%, #FFFFFF 0%, transparent 45%),
      radial-gradient(circle at 100% 110%, #E8F3F1 0%, transparent 50%),
      var(--bg);
  }
  .app{ width:100%; max-width:480px; }

  /* header */
  .hdr{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; }
  .hdr .tag{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.18em; color:var(--teal); }
  .hdr h1{ font-size:20px; font-weight:700; letter-spacing:-0.01em; margin-top:4px; }
  .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--text-dim); display:inline-block; margin-right:6px; }
  .status-dot.on{ background:var(--teal); box-shadow:0 0 8px var(--teal); }
  .status-dot.alarm{ background:var(--amber); box-shadow:0 0 10px var(--amber); animation:pulse 1s infinite; }
  @keyframes pulse{ 50%{opacity:.35;} }
  .status-line{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); text-align:right; }
  .clock-display{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--teal); margin-bottom:4px; letter-spacing:.02em; }
  .offline-badge{ color:var(--red); font-weight:600; margin-right:8px; }
  .online-badge{ color:var(--teal); font-weight:600; margin-right:8px; }

  .account-row{ margin-top:10px; }
  .account-info{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .account-avatar{ width:22px; height:22px; border-radius:50%; }
  .account-name{ font-size:12px; color:var(--text-dim); }
  .sync-dot{
    width:7px; height:7px; border-radius:50%; background:var(--teal);
    animation: pulse 1s infinite ease-in-out;
  }
  @keyframes pulse{ 0%,100%{opacity:0.3;} 50%{opacity:1;} }
  .guest-note{
    font-size:11px; color:var(--text-dim); background:var(--panel-2);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-top:8px;
    line-height:1.5;
  }

  /* ring */
  .ring-wrap{ position:relative; width:260px; height:260px; margin: 8px auto 20px; }
  svg.ring{ transform:rotate(-90deg); width:100%; height:100%; }
  .ring-bg{ fill:none; stroke:var(--panel-2); stroke-width:10; }
  .ring-fg{ fill:none; stroke:var(--teal); stroke-width:10; stroke-linecap:round; transition: stroke-dashoffset .5s ease, stroke .3s; }
  .ring-fg.alarm{ stroke:var(--amber); }
  .ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-time{ font-family:'JetBrains Mono',monospace; font-size:40px; font-weight:700; letter-spacing:-0.01em; }
  .ring-sub{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); margin-top:6px; letter-spacing:.08em; }
  .ring-ticks{ position:absolute; inset:0; }

  /* buttons */
  .row{ display:flex; gap:10px; margin-bottom:14px; }
  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    border-radius:10px; border:1px solid var(--line); cursor:pointer;
    padding:13px 16px; color:var(--text); background:var(--panel-2);
    transition: all .15s;
  }
  button:hover{ border-color:var(--teal); }
  button:active{ transform:scale(.98); }
  button.primary{ background:var(--teal); color:#08161A; border-color:var(--teal); flex:1; }
  button.primary:hover{ background:#7EF3E1; }
  button.ghost{ flex:1; }
  button.danger{ border-color:var(--red); color:var(--red); }
  button:disabled{ opacity:.35; cursor:not-allowed; }
  button.full{ width:100%; }

  /* panels */
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
  .panel h2{ font-size:12px; letter-spacing:.1em; color:var(--text-dim); text-transform:uppercase; margin-bottom:12px; font-family:'JetBrains Mono',monospace; }

  .settings-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .field label{ display:block; font-size:11px; color:var(--text-dim); margin-bottom:6px; font-family:'JetBrains Mono',monospace; }
  .field input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:9px 8px; font-family:'JetBrains Mono',monospace; font-size:14px;
  }
  .field input:focus{ outline:none; border-color:var(--teal); }
  .derived{ margin-top:12px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--teal-dim); }
  .derived b{ color:var(--teal); }

  .progress-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .progress-row .num{ font-family:'JetBrains Mono',monospace; font-size:15px; }
  .progress-row .num b{ color:var(--teal); font-size:19px; }
  .bar{ height:6px; background:var(--panel-2); border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--teal); transition:width .4s ease; }

  .log{ margin-top:10px; display:flex; flex-direction:column; gap:6px; max-height:140px; overflow-y:auto; }
  .log-item{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-dim); border-bottom:1px dashed var(--line); padding-bottom:5px; }
  .log-item span:last-child{ color:var(--teal); }
  .empty{ font-size:12px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; }

  /* camera modal */
  .overlay{
    position:fixed; inset:0; background:rgba(5,9,12,.88); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{ background:var(--panel); border:1px solid var(--line); border-radius:16px; width:100%; max-width:420px; padding:20px; }
  .modal h3{ font-size:16px; margin-bottom:4px; }
  .modal p.desc{ font-size:12px; color:var(--text-dim); margin-bottom:14px; }

  .consent-overlay{
    position:fixed; inset:0; background:rgba(5,9,12,.95); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;
  }
  .consent-modal{
    background:var(--panel); border:1px solid var(--teal-dim); border-radius:16px;
    width:100%; max-width:420px; padding:22px;
  }
  .consent-modal h3{ font-size:16px; margin-bottom:10px; color:var(--teal); }
  .consent-modal .body{ font-size:12.5px; color:var(--text); line-height:1.8; margin-bottom:16px; }
  .consent-check-row{
    display:flex; align-items:flex-start; gap:8px; margin-bottom:14px;
    font-size:12.5px; color:var(--text-dim); cursor:pointer;
  }
  .consent-check-row input{ margin-top:2px; width:16px; height:16px; accent-color:var(--teal); flex-shrink:0; }

  .screen-flash{
    position:fixed; inset:0; background:#fff; z-index:300;
    opacity:0; pointer-events:none;
  }
  .screen-flash.on{ opacity:1; transition:opacity 60ms ease-out; }
  .screen-flash.off{ opacity:0; transition:opacity 260ms ease-in; }

  .help-btn{
    background:var(--panel-2); border:1px solid var(--line); border-radius:50%;
    width:24px; height:24px; font-size:12px; color:var(--text-dim); cursor:pointer;
    margin-left:8px; line-height:1; display:inline-flex; align-items:center; justify-content:center;
  }
  .help-tabs{ display:flex; gap:6px; margin-bottom:14px; }
  .help-tab-btn{
    flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:8px; font-size:12.5px; color:var(--text-dim); cursor:pointer;
  }
  .help-tab-btn.active{ border-color:var(--teal); color:var(--teal); background:rgba(94,234,212,.08); }
  .faq-item{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; margin-bottom:8px;
  }
  .faq-q{ font-size:12.5px; font-weight:700; color:var(--text); margin-bottom:4px; }
  .faq-a{ font-size:12px; color:var(--text-dim); line-height:1.6; }
  .settings-panel-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid var(--line); font-size:12.5px;
  }
  .settings-panel-row:last-child{ border-bottom:none; }
  video, canvas{ width:100%; border-radius:10px; background:#000; }
  #video.mirror{ transform:scaleX(-1); } /* 전면 카메라일 때만 거울처럼 반전 (후면 카메라는 반전 안 함). 실제 캡처 이미지는 원본 그대로 유지되어 AI 분석엔 영향 없음 */
  .video-wrap{ position:relative; margin-bottom:14px; border:1px solid var(--line); border-radius:10px; overflow:hidden; }

  .flash-icon-btn{
    position:absolute; top:10px; right:10px; z-index:5;
    width:34px; height:34px; border-radius:50%;
    background:rgba(20,28,36,.65); backdrop-filter:blur(3px);
    border:1.5px solid rgba(255,255,255,.35); color:rgba(255,255,255,.75);
    font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .flash-icon-btn.active{
    background:#FFB627; border-color:#FFB627; color:#241a00;
    box-shadow:0 0 10px rgba(255,182,39,.6);
  }
  .verdict{ margin-top:12px; font-family:'JetBrains Mono',monospace; font-size:13px; padding:10px; border-radius:8px; }
  .verdict.pending{ background:var(--panel-2); color:var(--text-dim); }
  .verdict.yes{ background:rgba(94,234,212,.12); color:var(--teal); border:1px solid var(--teal-dim); }
  .verdict.no{ background:rgba(248,113,113,.1); color:var(--red); border:1px solid #7A3535; }
  body.light .verdict.no{ background:rgba(220,38,38,.08); border:1px solid #F3B4B4; }
  body.light .verdict.yes{ background:rgba(14,156,140,.1); }

  .footnote{ font-size:11px; color:var(--text-dim); line-height:1.6; text-align:center; margin-top:18px; }

  .lang-switch{ display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; align-items:center; }
  .lang-btn{
    font-family:'JetBrains Mono',monospace; font-size:10px; padding:4px 8px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text-dim); cursor:pointer;
  }
  .lang-btn.active{ border-color:var(--teal); color:var(--teal); background:rgba(94,234,212,.08); }

  .lang-select{
    font-family:'JetBrains Mono',monospace; font-size:12px; padding:6px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--teal); cursor:pointer;
    max-width:100%;
  }

  .theme-switch{ display:flex; gap:4px; }
  .theme-btn{
    font-size:13px; padding:4px 9px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text-dim); cursor:pointer;
    line-height:1.4;
  }
  .theme-btn.active{ border-color:var(--teal); color:var(--teal); background:rgba(94,234,212,.08); }

  .stats-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat-box{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 6px; text-align:center; }
  .stat-num{ font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; color:var(--text); }
  .stat-label{ font-size:10px; color:var(--text-dim); margin-top:2px; }

  .judge-banner{
    background:rgba(94,234,212,.08); border:1px solid var(--teal-dim); color:var(--teal);
    font-size:12px; padding:10px 12px; border-radius:10px; text-align:center; margin-bottom:14px;
  }
</style>
</head>

  // ---------- state ----------

  function t(key, ...args){
    const entry = I18N[state.lang][key];
    return typeof entry === 'function' ? entry(...args) : entry;
  }

  const LANG_NAMES = {
    ko: '한국어', en: 'English', ja: '日本語',
    zh: '中文', vi: 'Tiếng Việt', th: 'ภาษาไทย',
    id: 'Bahasa Indonesia', tl: 'Tagalog',
  };
  function renderLangSelect(selectId){
    const opts = Object.keys(LANG_NAMES).map(code =>
      `<option value="${code}" ${state.lang===code?'selected':''}>${LANG_NAMES[code]}</option>`
    ).join('');
    return `<select class="lang-select" id="${selectId}">${opts}</select>`;
  }

  function renderHelpModal(){
    const faqItems = [1,2,3,4,5].map(n => `
      <div class="faq-item">
        <div class="faq-q">${t('faqQ'+n)}</div>
        <div class="faq-a">${t('faqA'+n)}</div>
      </div>
    `).join('');

    const soundOptions = ['siren','bell','digital'];
    const settingsBody = `
      <div class="settings-panel-row">
        <span style="flex:1;">${t('settingsVibrationLabel')}</span>
        <button class="ghost" id="helpToggleVibration" style="font-size:12px; flex:0 0 auto; padding:6px 14px;">${state.vibrationEnabled ? t('vibrationOn') : t('vibrationOff')}</button>
      </div>

      <div class="settings-panel-row" style="flex-direction:column; align-items:stretch;">
        <span style="margin-bottom:8px;">${t('settingsSoundLabel')}</span>
        <div style="display:flex; flex-direction:column; gap:6px;">
          ${soundOptions.map(s => `
            <div style="display:flex; gap:6px; align-items:center;">
              <button class="ghost" style="flex:1; text-align:left; font-size:12px; ${state.alarmSound===s ? 'border-color:var(--teal); color:var(--teal);' : ''}" data-sound="${s}" id="helpSound_${s}">
                ${state.alarmSound===s ? '● ' : '○ '}${t('sound_'+s)}
              </button>
              <button class="ghost" style="font-size:12px; padding:8px 10px;" data-preview="${s}" id="helpPreview_${s}">▶</button>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="settings-panel-row" style="flex-direction:column; align-items:stretch;">
        <span style="margin-bottom:6px;">${t('settingsDayStartLabel')}</span>
        <input type="number" id="helpDayStartHour" min="0" max="23" value="${state.dayStartHour}"
          style="background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 10px; font-size:13px; width:100%;">
        <div style="font-size:11px; color:var(--text-dim); margin-top:6px; line-height:1.5;">${t('dayStartHint')}</div>
      </div>
    `;

    return `
      <div class="overlay" id="helpOverlay">
        <div class="modal">
          <div class="help-tabs">
            <button class="help-tab-btn ${state.helpTab==='faq'?'active':''}" id="helpTabFaqBtn">${t('helpTabFaq')}</button>
            <button class="help-tab-btn ${state.helpTab==='settings'?'active':''}" id="helpTabSettingsBtn">${t('helpTabSettings')}</button>
          </div>
          <div style="max-height:420px; overflow-y:auto;">
            ${state.helpTab === 'faq' ? faqItems : settingsBody}
          </div>
          <div class="row" style="margin-top:14px;">
            <button class="ghost full" id="btnCloseHelp">${t('historyClose')}</button>
          </div>
        </div>
      </div>
    `;
  }

  function bindHelpEvents(){
    const $ = id => document.getElementById(id);
    if($('btnOpenHelp')) $('btnOpenHelp').onclick = () => { state.helpOpen = true; render(); };
    if($('btnCloseHelp')) $('btnCloseHelp').onclick = () => { state.helpOpen = false; render(); };
    if($('helpOverlay')) $('helpOverlay').onclick = (e) => { if(e.target.id === 'helpOverlay'){ state.helpOpen = false; render(); } };
    if($('helpTabFaqBtn')) $('helpTabFaqBtn').onclick = () => { state.helpTab = 'faq'; render(); };
    if($('helpTabSettingsBtn')) $('helpTabSettingsBtn').onclick = () => { state.helpTab = 'settings'; render(); };

    if($('helpToggleVibration')) $('helpToggleVibration').onclick = () => { state.vibrationEnabled = !state.vibrationEnabled; render(); };

    ['siren','bell','digital'].forEach(s => {
      if($('helpSound_'+s)) $('helpSound_'+s).onclick = () => { state.alarmSound = s; render(); };
      if($('helpPreview_'+s)) $('helpPreview_'+s).onclick = (e) => { e.stopPropagation(); previewAlarmSound(s); };
    });


    if($('helpDayStartHour')) $('helpDayStartHour').onchange = (e) => {
      let v = parseInt(e.target.value, 10);
      if(isNaN(v)) v = 0;
      v = Math.max(0, Math.min(23, v));
      state.dayStartHour = v;
      render();
    };
  }

  function renderConsentModal(){
    return `
      <div class="consent-overlay">
        <div class="consent-modal">
          <div style="margin-bottom:14px;">
            ${renderLangSelect('consentLangSelect')}
          </div>
          <h3>${t('consentTitle')}</h3>
          <div class="body">${t('consentBody')}</div>
          <label class="consent-check-row">
            <input type="checkbox" id="consentCheckbox" ${state.consentChecked ? 'checked' : ''}>
            <span>${t('consentCheckbox')}</span>
          </label>
          <label class="consent-check-row" style="opacity:.8;">
            <input type="checkbox" id="dontShowAgainCheckbox" ${state.dontShowAgainChecked ? 'checked' : ''}>
            <span>${t('dontShowAgain')}</span>
          </label>
          <button class="primary full" id="consentConfirmBtn" ${state.consentChecked ? '' : 'disabled'}>${t('consentBtn')}</button>
        </div>
      </div>
    `;
  }

  function bindConsentEvents(){
    const $ = id => document.getElementById(id);
    if($('consentLangSelect')) $('consentLangSelect').onchange = (e) => { state.lang = e.target.value; render(); };
    if($('consentCheckbox')) $('consentCheckbox').onchange = (e) => { state.consentChecked = e.target.checked; render(); };
    if($('dontShowAgainCheckbox')) $('dontShowAgainCheckbox').onchange = (e) => { state.dontShowAgainChecked = e.target.checked; render(); };
    if($('consentConfirmBtn')) $('consentConfirmBtn').onclick = () => {
      if(!state.consentChecked) return;
      state.privacyConsented = true;
      try{
        if(state.dontShowAgainChecked){
          // "다시 표시하지 않기"를 체크한 경우: 영구 동의로 저장 (24시간 제한 없음)
          localStorage.setItem('hydrocheck_privacy_consent_permanent', 'true');
        } else {
          // 체크 안 한 경우: 기존처럼 24시간 동안만 유효
          localStorage.setItem('hydrocheck_privacy_consent_at', Date.now().toString());
        }
      }catch(e){}
      render();
    };
  }

  function intervalMinutes(){
    const drinksNeeded = state.goalMl / state.perDrinkMl;
    const windowMin = state.windowHours * 60;
    return Math.max(1, Math.round(windowMin / drinksNeeded));
  }

  function fmt(sec){
    const m = Math.floor(sec/60).toString().padStart(2,'0');
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  function render(){
    savePersisted();
    document.body.classList.toggle('light', state.theme === 'light');
    const themeColorMeta = document.getElementById('themeColorMeta');
    if(themeColorMeta) themeColorMeta.setAttribute('content', state.theme === 'light' ? '#F4F7F8' : '#0D1319');
    const intervalMin = intervalMinutes();
    const totalSec = intervalMin*60;
    const pct = state.remainingSec==null ? 0 : Math.max(0, Math.min(1, 1 - state.remainingSec/totalSec));
    const R = 118;
    const C = 2*Math.PI*R;
    const dash = C - pct*C;
    const progressPct = Math.min(100, (state.consumedMl/state.goalMl*100)).toFixed(0);

    // 최초 1회 개인정보 고지에 동의하기 전에는 앱 본체를 렌더링하지 않고 동의 화면만 보여준다.
    if(!state.privacyConsented){
      appEl.innerHTML = renderConsentModal();
      bindConsentEvents();
      return;
    }

    appEl.innerHTML = `
      <div class="hdr">
        <div>
          <div class="tag">${t('tag')}</div>
          <h1>${t('title')}</h1>
          <div class="lang-switch">
            ${renderLangSelect('headerLangSelect')}
            <span style="width:6px;"></span>
            <div class="theme-switch">
              <button class="theme-btn ${state.theme==='dark'?'active':''}" id="themeDark" title="Dark mode" aria-label="다크 모드로 전환" aria-pressed="${state.theme==='dark'}">🌙</button>
              <button class="theme-btn ${state.theme==='light'?'active':''}" id="themeLight" title="Light mode" aria-label="라이트 모드로 전환" aria-pressed="${state.theme==='light'}">☀️</button>
            </div>
          </div>
        </div>
        <div class="status-line">
          <div id="clockDisplay" class="clock-display"></div>
          ${state.offline
            ? `<span class="offline-badge">🔴 ${t('offlineLabel')}</span>`
            : `<span class="online-badge">🟢 ${t('onlineLabel')}</span>`}
          <span class="status-dot ${state.alarm ? 'alarm' : (state.running?'on':'')}"></span>
          ${state.alarm ? t('statusAlarm') : (state.running ? t('statusOn') : t('statusOff'))}
          <button class="help-btn" id="btnOpenHelp" aria-label="${t('helpBtnLabel')}" title="${t('helpBtnLabel')}">🔍</button>
        </div>
      </div>

      <div class="account-row">
        ${state.user
          ? `<div class="account-info">
               <img src="${state.user.photoURL || ''}" class="account-avatar" onerror="this.style.display='none'">
               <span class="account-name">${state.user.displayName || state.user.email || ''}</span>
               ${state.syncing ? `<span class="sync-dot" title="${t('syncingNote')}"></span>` : ''}
               <button class="ghost" id="btnHistory" style="font-size:11px; padding:5px 10px;">${t('btnHistory')}</button>
               <button class="ghost" id="btnLogout" style="font-size:11px; padding:5px 10px;">${t('btnLogout')}</button>
             </div>`
          : `<div class="account-info">
               <button class="ghost" id="btnLogin" style="font-size:12px;">${t('btnLogin')}</button>
             </div>`
        }
      </div>
      ${!state.user ? `<div class="guest-note">${t('guestNote')}</div>` : ''}

      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 260 260">
          <circle class="ring-bg" cx="130" cy="130" r="${R}"/>
          <circle class="ring-fg ${state.alarm?'alarm':''}" cx="130" cy="130" r="${R}"
            stroke-dasharray="${C}" stroke-dashoffset="${state.running||state.alarm?dash:0}"/>
        </svg>
        <div class="ring-center">
          <div class="ring-time">${state.alarm ? '🔔' : fmt(state.remainingSec ?? totalSec)}</div>
          <div class="ring-sub">${state.alarm ? t('ringAlarmSub') : (state.running ? t('ringRunningSub', intervalMin) : t('ringIdleSub', intervalMin))}</div>
        </div>
      </div>

      <div class="row">
        ${!state.running && !state.alarm ? `<button class="primary full" id="btnStart">${t('btnStart')}</button>` : ''}
        ${state.running && !state.alarm ? `<button class="danger full" id="btnStop">${t('btnStop')}</button>` : ''}
        ${state.alarm ? `<button class="primary full" id="btnOpenCam">${t('btnOpenCam')}</button>` : ''}
      </div>
      ${state.alarm && !state.snoozeUsed ? `
      <div class="row">
        <button class="ghost full" id="btnSnooze" style="font-size:12px;">${t('btnSnooze')}</button>
      </div>` : ''}
      ${!state.alarm ? `
      <div class="row">
        <button class="ghost full" id="btnTest" style="font-size:12px;">${t('btnTest')}</button>
      </div>
      <div class="judge-banner">${t('judgeBanner')}</div>` : ''}

      <div class="panel">
        <h2>${t('todayIntakeTitle')}</h2>
        <div class="progress-row">
          <span class="num"><b>${state.consumedMl}</b> / ${state.goalMl} ml</span>
          <span class="num">${progressPct}%</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:${progressPct}%"></div></div>
        <div class="log">
          ${state.log.length===0 ? `<div class="empty">${t('emptyLog')}</div>` :
            state.log.slice().reverse().map(l=>`<div class="log-item"><span>${l.time}</span><span>+${l.ml}ml</span></div>`).join('')}
        </div>
      </div>

      <div class="panel">
        <h2>${t('statsTitle')}</h2>
        ${renderStats()}
      </div>

      <div class="panel">
        <h2>${t('settingsTitle')}</h2>
        <div class="settings-grid">
          <div class="field">
            <label>${t('labelGoal')}</label>
            <input type="number" id="inGoal" value="${state.goalMl}" step="100">
          </div>
          <div class="field">
            <label>${t('labelWindow')}</label>
            <input type="number" id="inWindow" value="${state.windowHours}" step="0.5">
          </div>
          <div class="field">
            <label>${t('labelDrink')}</label>
            <input type="number" id="inDrink" value="${state.perDrinkMl}" step="50">
          </div>
        </div>
        <div class="derived">${t('derived', intervalMinutes(), state.perDrinkMl, Math.ceil(state.goalMl/state.perDrinkMl))}</div>
        <div class="row" style="margin-top:10px;">
          <button class="ghost full" id="btnResetToday" style="font-size:12px;">${t('btnResetToday')}</button>
        </div>
      </div>

      <div class="footnote">
        ${t('footnote')}
      </div>

      ${state.camOpen ? renderModal() : ''}
      ${state.historyOpen ? renderHistoryModal() : ''}
      ${state.helpOpen ? renderHelpModal() : ''}
    `;
    bindEvents(intervalMin);
    bindHelpEvents();
    updateClock();

    // render()가 innerHTML을 다시 그리면 <video> 태그도 새로 생성되어 기존 스트림 연결이 끊긴다.
    // 카메라가 켜져 있는 상태(state.stream 존재)라면 새로 생긴 video 태그에 스트림을 다시 붙여준다.
    if(state.camOpen && state.stream){
      const videoEl = document.getElementById('video');
      if(videoEl && videoEl.srcObject !== state.stream){
        videoEl.srcObject = state.stream;
      }
    }
  }

  function renderStats(){
    const successCount = state.log.length;
    const failCount = state.failCount;
    const totalAttempts = successCount + failCount;
    if(totalAttempts === 0){
      return `<div class="empty">${t('statsNoData')}</div>`;
    }
    const rate = Math.round((successCount/totalAttempts)*100);
    let avgIntervalMin = '-';
    if(state.log.length >= 2){
      const sorted = state.log.slice().sort((a,b)=>a.ts-b.ts);
      let diffs = [];
      for(let i=1;i<sorted.length;i++){ diffs.push((sorted[i].ts - sorted[i-1].ts)/60000); }
      avgIntervalMin = Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length);
    }
    return `
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-num">${totalAttempts}</div><div class="stat-label">${t('statsAttempts')}</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--teal)">${successCount}</div><div class="stat-label">${t('statsSuccess')}</div></div>
        <div class="stat-box"><div class="stat-num" style="color:#ff6b6b">${failCount}</div><div class="stat-label">${t('statsFail')}</div></div>
        <div class="stat-box"><div class="stat-num">${rate}%</div><div class="stat-label">${t('statsRate')}</div></div>
        <div class="stat-box"><div class="stat-num">${avgIntervalMin}${typeof avgIntervalMin==='number'?t('minUnit'):''}</div><div class="stat-label">${t('statsAvgInterval')}</div></div>
      </div>
    `;
  }

  function renderModal(){
    let verdictHtml = '';
    if(state.verdict === 'pending'){
      verdictHtml = `<div class="verdict pending">${t('verdictPending')}</div>`;
    } else if(state.verdict === 'yes'){
      verdictHtml = `<div class="verdict yes">${t('verdictYes', state.verdictReason)}</div>`;
    } else if(state.verdict === 'no'){
      verdictHtml = `<div class="verdict no">${t('verdictNo', state.verdictReason)}</div>`;
    }
    return `
      <div class="overlay" id="overlay">
        <div class="modal">
          <h3>${t('modalTitle')}</h3>
          <p class="desc">${t('modalDesc')}</p>
          <div class="video-wrap">
            <video id="video" class="mirror" autoplay playsinline muted></video>
            <button class="flash-icon-btn ${state.screenFlashOn ? 'active' : ''}" id="btnToggleFlash" aria-label="${state.screenFlashOn ? t('flashOn') : t('flashOff')}" title="${state.screenFlashOn ? t('flashOn') : t('flashOff')}">⚡</button>
          </div>
          ${verdictHtml}
          <div class="row" style="margin-top:12px;">
            <button class="ghost" id="btnCancel">${t('btnCancel')}</button>
            ${state.verdict === 'no'
              ? `<button class="primary" id="btnRetry">${t('btnRetry')}</button>`
              : `<button class="primary" id="btnCapture" ${state.verdict==='pending'?'disabled':''}>${t('btnCapture')}</button>`
            }
          </div>
        </div>
      </div>
    `;
  }

  function renderHistoryModal(){
    const rows = state.history.length === 0
      ? `<div class="empty">${t('historyEmpty')}</div>`
      : state.history.map(d => `
          <div class="log-item">
            <span>${d.date}</span>
            <span>${d.consumedMl ?? 0}ml · ${d.successCount ?? 0}${state.lang==='ko'?'회 성공':state.lang==='ja'?'回成功':' success'}</span>
          </div>
        `).join('');
    return `
      <div class="overlay" id="historyOverlay">
        <div class="modal">
          <h3>${t('historyTitle')}</h3>
          <div class="log" style="max-height:340px; overflow-y:auto;">${rows}</div>
          <div class="row" style="margin-top:12px;">
            <button class="ghost full" id="btnHistoryClose">${t('historyClose')}</button>
          </div>
        </div>
      </div>
    `;
  }

  function bindEvents(intervalMin){
    const $ = id => document.getElementById(id);

    if($('inGoal')) $('inGoal').onchange = e => { state.goalMl = Math.max(500, +e.target.value||3500); render(); };
    if($('inWindow')) $('inWindow').onchange = e => { state.windowHours = Math.max(1, +e.target.value||9); render(); };
    if($('inDrink')) $('inDrink').onchange = e => { state.perDrinkMl = Math.max(50, +e.target.value||200); render(); };

    if($('btnStart')) $('btnStart').onclick = () => startTimer(intervalMin);
    if($('btnStop')) $('btnStop').onclick = stopTimer;
    if($('btnOpenCam')) $('btnOpenCam').onclick = openCamera;
    if($('btnSnooze')) $('btnSnooze').onclick = snoozeAlarm;
    if($('btnTest')) $('btnTest').onclick = () => {
      unlockAudio(); // 버튼 클릭(사용자 제스처) 시점에 오디오 언락
      clearInterval(state.intervalId);
      triggerAlarm();
    };
    if($('headerLangSelect')) $('headerLangSelect').onchange = (e) => { state.lang = e.target.value; render(); };
    if($('themeDark')) $('themeDark').onclick = () => { state.theme = 'dark'; render(); };
    if($('themeLight')) $('themeLight').onclick = () => { state.theme = 'light'; render(); };
    if($('btnCancel')) $('btnCancel').onclick = closeCamera;
    if($('btnCapture')) $('btnCapture').onclick = captureAndVerify;
    if($('btnToggleFlash')) $('btnToggleFlash').onclick = async () => {
      state.screenFlashOn = !state.screenFlashOn;
      render();
      if(state.screenFlashOn){
        // 켜는 순간 바로 한 번 번쩍여서, 버튼만 눌러서는 아무 반응이 없다는 혼란을 없앤다.
        await triggerScreenFlash();
        endScreenFlash();
      }
    };
    if($('btnRetry')) $('btnRetry').onclick = () => { state.verdict = null; state.verdictReason=''; render(); };
    if($('btnResetToday')) $('btnResetToday').onclick = resetToday;
    if($('btnLogin')) $('btnLogin').onclick = signInWithGoogle;
    if($('btnLogout')) $('btnLogout').onclick = signOutUser;
    if($('btnHistory')) $('btnHistory').onclick = openHistory;
    if($('btnHistoryClose')) $('btnHistoryClose').onclick = () => { state.historyOpen = false; render(); };
    if($('historyOverlay')) $('historyOverlay').onclick = (e) => { if(e.target.id === 'historyOverlay'){ state.historyOpen = false; render(); } };
  }

  // ---------- timer ----------
  function armCountdown(seconds){
    clearInterval(state.intervalId);
    state.remainingSec = seconds;
    state.intervalId = setInterval(()=>{
      state.remainingSec -= 1;
      if(state.remainingSec <= 0){
        clearInterval(state.intervalId);
        triggerAlarm();
      } else {
        render();
      }
    }, 1000);
  }

  function startTimer(intervalMin){
    unlockAudio(); // 사용자가 직접 누른 클릭 시점에 오디오를 미리 깨워둬야 나중에 타이머가 자동으로 알람 울릴 때도 소리가 막히지 않는다
    state.running = true;
    armCountdown(intervalMin*60);
    render();
  }

  function stopTimer(){
    state.running = false;
    clearInterval(state.intervalId);
    state.remainingSec = null;
    render();
  }

  // 작업 특성상 즉시 인증이 어려운 상황(예: 위험 작업 중, 이동 중)을 위한 5분 연기(스누즈) 기능.
  // 알람 1회당 딱 한 번만 허용된다 - 한 번 쓰고 나면 물을 마셔서 인증할 때까지 계속 울린다.
  function snoozeAlarm(){
    if(state.snoozeUsed) return;
    state.snoozeUsed = true;
    stopBeep();
    stopVibrate();
    state.alarm = false;
    state.running = true;
    armCountdown(5*60);
    render();
  }

  function triggerAlarm(){
    state.running = false;
    state.alarm = true;
    playBeepLoop();
    startVibrate();
    render();
  }

  // ---------- sound ----------
  function unlockAudio(){
    if(!state.audioCtx) state.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(state.audioCtx.state === 'suspended') state.audioCtx.resume();
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    gain.gain.value = 0.0001;
    osc.connect(gain).connect(state.audioCtx.destination);
    osc.start();
    osc.stop(state.audioCtx.currentTime + 0.05);
  }

  function playSiren(ctx, startAt){
    [880, 1046.5].forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      const t0 = startAt + i*0.22;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(1, t0+0.02);
      gain.gain.linearRampToValueAtTime(0.0001, t0+0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0+0.24);
    });
  }
  function playBell(ctx, startAt){
    // 부드러운 단일 종소리(사인파, 서서히 감쇠)
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 987.77; // B5
    gain.gain.setValueAtTime(0.0001, startAt);
    gain.gain.linearRampToValueAtTime(0.9, startAt+0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt+0.9);
    osc.connect(gain).connect(ctx.destination);
    osc.start(startAt);
    osc.stop(startAt+0.9);
  }
  function playDigital(ctx, startAt){
    // 짧고 또렷한 디지털 삐-삐 (톱니파, 높은 음)
    [1568, 1568].forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      const t0 = startAt + i*0.16;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(0.8, t0+0.015);
      gain.gain.linearRampToValueAtTime(0.0001, t0+0.12);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0+0.14);
    });
  }
  const SOUND_FN = { siren: playSiren, bell: playBell, digital: playDigital };
  const SOUND_INTERVAL = { siren: 550, bell: 1000, digital: 500 };

  function previewAlarmSound(soundName){
    unlockAudio();
    const ctx = state.audioCtx;
    const fn = SOUND_FN[soundName] || playSiren;
    fn(ctx, ctx.currentTime);
  }

  function playBeepLoop(){
    if(!state.audioCtx) state.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = state.audioCtx;
    if(ctx.state === 'suspended') ctx.resume();

    function beep(){
      if(!state.alarm) return;
      if(ctx.state === 'suspended') ctx.resume(); // 모바일에서 화면이 잠깐 꺼졌다 켜졌을 때도 재개 시도
      const fn = SOUND_FN[state.alarmSound] || playSiren;
      fn(ctx, ctx.currentTime);
      state.beepId = setTimeout(beep, SOUND_INTERVAL[state.alarmSound] || 550);
    }
    beep();
  }
  function stopBeep(){
    clearTimeout(state.beepId);
  }

  // 모바일에서 화면이 꺼졌다 켜지거나 다른 앱으로 전환됐다 돌아왔을 때
  // 오디오 컨텍스트가 일시정지된 상태로 남아있을 수 있어, 다시 활성화될 때 재개시킨다.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible' && state.audioCtx && state.audioCtx.state === 'suspended'){
      state.audioCtx.resume();
    }
  });

  // 네트워크 연결 상태 변화를 감지해 화면에 실시간으로 표시
  window.addEventListener('online', ()=>{ state.offline = false; render(); });
  window.addEventListener('offline', ()=>{ state.offline = true; render(); });

  // ---------- vibration ----------
  function startVibrate(){
    if(!navigator.vibrate) return; // iOS Safari는 진동 API 미지원
    if(!state.vibrationEnabled) return; // 사용자가 설정에서 진동을 꺼둔 경우
    function pulse(){
      if(!state.alarm) return;
      navigator.vibrate([500, 150, 500]);
      state.vibrateId = setTimeout(pulse, 1300);
    }
    pulse();
  }
  function stopVibrate(){
    clearTimeout(state.vibrateId);
    if(navigator.vibrate) navigator.vibrate(0);
  }

  // ---------- camera ----------
  async function openCamera(){
    state.camOpen = true;
    state.verdict = null;
    render();
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode: 'user' }, audio:false });
      state.stream = stream;
      const video = document.getElementById('video');
      if(video){ video.srcObject = stream; }
    } catch(err){
      alert(t('camDenied'));
    }
  }

  function closeCamera(){
    if(state.stream){ state.stream.getTracks().forEach(t=>t.stop()); state.stream=null; }
    state.camOpen = false;
    state.verdict = null;
    render();
  }

  async function triggerScreenFlash(){
    const el = document.getElementById('screenFlash');
    if(!el) return;
    el.classList.remove('off');
    el.classList.add('on');
    // 화면이 밝아진 빛이 실제로 얼굴에 비치고 카메라 노출이 적응할 시간을 잠깐 준다.
    await new Promise(r => setTimeout(r, 260));
  }
  function endScreenFlash(){
    const el = document.getElementById('screenFlash');
    if(!el) return;
    el.classList.remove('on');
    el.classList.add('off');
  }

  async function captureAndVerify(){
    const video = document.getElementById('video');
    if(!video || !video.videoWidth){ alert(t('camNotReady')); return; }

    if(state.screenFlashOn){
      await triggerScreenFlash(); // 전면 카메라엔 물리 플래시가 없어 화면 밝기로 대신 조명
    }

    // 이미지가 너무 크면 업로드·AI 분석 시간이 길어져 타임아웃 위험이 커지므로
    // 긴 변 기준 최대 800px로 축소해서 전송한다 (판별 정확도에는 지장 없는 수준).
    const maxDim = 800;
    const scale = Math.min(1, maxDim / Math.max(video.videoWidth, video.videoHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    if(state.screenFlashOn) endScreenFlash();
    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
    const base64 = dataUrl.split(',')[1];

    state.verdict = 'pending';
    render();

    try{
      const response = await fetch('/api/verify', {
        method:'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({ image: base64, lang: state.lang })
      });
      if(!response.ok){
        const errData = await response.json().catch(()=>({}));
        console.error('서버 오류 상세 (' + response.status + '):', errData.error || '알 수 없음');
        // 상태 코드별로 원인이 다르므로 에러 키만 담아서 던지고, catch에서 언어별 문구로 변환
        if(response.status === 429) throw new Error('rateLimitError');       // AI 사용량 한도 초과
        if(response.status === 504) throw new Error('timeoutError');       // 진짜 응답 시간 초과 (60초 넘음)
        if(response.status === 503) throw new Error('serviceBusyError');   // AI 서버가 빠르게 "혼잡함"으로 거절한 경우
        throw new Error('friendlyError'); // 그 외 서버 오류
      }
      const result = await response.json();
      const isYes = !!result.drinking;
      const reason = result.reason || '';

      if(!isYes) state.failCount += 1; // 실제 AI 판별 실패만 통계에 반영 (네트워크 오류는 미포함)

      state.verdict = isYes ? 'yes' : 'no';
      state.verdictReason = reason;
      render();
      if(isYes){
        setTimeout(()=>{ closeCamera(); completeDrink(); }, 900);
      }
    } catch(err){
      state.verdict = 'no';
      // err.message가 우리가 정의한 오류 키(rateLimitError 등)면 그 문구를, 아니면(네트워크 단절 등) networkError 문구를 사용
      const knownKeys = ['friendlyError','rateLimitError','timeoutError','serviceBusyError','networkError'];
      state.verdictReason = t(knownKeys.includes(err.message) ? err.message : 'networkError');
      render();
      console.error('AI 판별 오류 (기술적 상세):', err); // 실제 오류 원인은 개발자 콘솔에만 기록
    }
  }

  function completeDrink(){
    state.alarm = false;
    stopBeep();
    stopVibrate();
    state.snoozeUsed = false; // 새로운 알람 주기가 시작되므로 다음 알람에서는 다시 스누즈 가능
    state.consumedMl += state.perDrinkMl;
    const now = new Date();
    state.log.push({ time: now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}), ml: state.perDrinkMl, ts: now.getTime() });
    startTimer(intervalMinutes());
  }

  function resetToday(){
    if(!confirm(t('confirmReset'))) return;
    state.consumedMl = 0;
    state.log = [];
    state.failCount = 0;
    savePersisted();
    render();
  }

  // ---------- persistence ----------
  // 게스트 모드: 실제 배포된 사이트(Vercel)에서는 새로고침 후에도 데이터가 유지됩니다.
  // 로그인 모드: Firestore(클라우드)에 저장되어 기기를 바꿔도 기록이 유지됩니다.

  // 교대근무자를 위해 "오늘"의 기준을 자정이 아니라 설정한 시각(dayStartHour)으로 옮긴다.
  // 예: dayStartHour가 6이면, 새벽 6시 이전은 "어제"로 취급된다.
  function getLogicalDay(d = new Date()){
    const shifted = new Date(d);
    if(d.getHours() < state.dayStartHour){
      shifted.setDate(shifted.getDate() - 1);
    }
    return shifted;
  }

  function savePersisted(){
    if(state.user){ saveToCloud(); return; }
    try{
      localStorage.setItem('hydrocheck_state', JSON.stringify({
        date: getLogicalDay().toDateString(),
        goalMl: state.goalMl,
        windowHours: state.windowHours,
        perDrinkMl: state.perDrinkMl,
        consumedMl: state.consumedMl,
        log: state.log,
        failCount: state.failCount,
        lang: state.lang,
        theme: state.theme,
        vibrationEnabled: state.vibrationEnabled,
        alarmSound: state.alarmSound,
        dayStartHour: state.dayStartHour,
      }));
    }catch(e){ /* 저장소 사용 불가 환경 - 조용히 무시 */ }
  }
  function loadPersisted(){
    try{
      const raw = localStorage.getItem('hydrocheck_state');
      if(!raw) return;
      const saved = JSON.parse(raw);
      state.goalMl = saved.goalMl ?? state.goalMl;
      state.windowHours = saved.windowHours ?? state.windowHours;
      state.perDrinkMl = saved.perDrinkMl ?? state.perDrinkMl;
      state.lang = saved.lang ?? state.lang;
      state.theme = saved.theme ?? state.theme;
      state.vibrationEnabled = saved.vibrationEnabled ?? state.vibrationEnabled;
      state.alarmSound = saved.alarmSound ?? state.alarmSound;
      state.dayStartHour = saved.dayStartHour ?? state.dayStartHour;
      if(saved.date === getLogicalDay().toDateString()){
        // 같은 논리적 하루(dayStartHour 기준)면 오늘 기록도 그대로 복원
        state.consumedMl = saved.consumedMl ?? 0;
        state.log = saved.log ?? [];
        state.failCount = saved.failCount ?? 0;
      }
      // 날짜가 다르면 설정값만 유지하고 오늘 기록은 새로 시작
    }catch(e){ /* 저장소 사용 불가 환경 - 조용히 무시 */ }
    try{
      if(localStorage.getItem('hydrocheck_privacy_consent_permanent') === 'true'){
        state.privacyConsented = true; // "다시 표시하지 않기"를 선택했던 경우 - 영구적으로 안 물어봄
      } else {
        const consentedAt = parseInt(localStorage.getItem('hydrocheck_privacy_consent_at'), 10);
        const ONE_DAY_MS = 24 * 60 * 60 * 1000;
        if(!isNaN(consentedAt) && (Date.now() - consentedAt) < ONE_DAY_MS){
          state.privacyConsented = true; // 동의 후 24시간 이내면 다시 안 물어봄
        }
        // 24시간이 지났거나 동의 기록이 없으면 privacyConsented는 false로 유지되어 다시 동의를 받는다
      }
    }catch(e){ /* 저장소 사용 불가 환경 - 매번 동의 화면부터 시작 (안전한 기본값) */ }
  }

  // ---------- Firebase 로그인 & 클라우드 저장 (선택 사항) ----------
  function dateKey(d = new Date()){
    return getLogicalDay(d).toLocaleDateString('en-CA'); // "YYYY-MM-DD" 형식, Firestore 문서 ID로 사용. dayStartHour 기준 반영
  }

  function signInWithGoogle(){
    if(!firebaseReady){ alert('Firebase 설정이 아직 완료되지 않았습니다. firebaseConfig 값을 확인해주세요.'); return; }
    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider).catch(err=>{
      console.error('로그인 실패', err);
      alert(t('loginError'));
    });
  }

  function signOutUser(){
    if(!firebaseReady) return;
    firebase.auth().signOut();
  }

  async function saveToCloud(){
    if(!state.user || !firebaseReady) return;
    try{
      const db = firebase.firestore();
      const uid = state.user.uid;
      await db.collection('users').doc(uid).set({
        goalMl: state.goalMl, windowHours: state.windowHours, perDrinkMl: state.perDrinkMl,
        lang: state.lang, theme: state.theme, updatedAt: new Date().toISOString(),
        vibrationEnabled: state.vibrationEnabled, alarmSound: state.alarmSound,
        dayStartHour: state.dayStartHour,
      }, { merge: true });
      await db.collection('users').doc(uid).collection('days').doc(dateKey()).set({
        date: dateKey(), consumedMl: state.consumedMl, log: state.log,
        failCount: state.failCount, successCount: state.log.length,
      }, { merge: true });
    }catch(e){
      console.error('클라우드 저장 실패', e); // 저장 실패해도 화면 사용엔 지장 없도록 조용히 처리
    }
  }

  async function loadFromCloud(){
    if(!state.user || !firebaseReady) return;
    state.syncing = true; render();
    try{
      const db = firebase.firestore();
      const uid = state.user.uid;
      const userDoc = await db.collection('users').doc(uid).get();
      if(userDoc.exists){
        const d = userDoc.data();
        state.goalMl = d.goalMl ?? state.goalMl;
        state.windowHours = d.windowHours ?? state.windowHours;
        state.perDrinkMl = d.perDrinkMl ?? state.perDrinkMl;
        state.lang = d.lang ?? state.lang;
        state.theme = d.theme ?? state.theme;
        state.vibrationEnabled = d.vibrationEnabled ?? state.vibrationEnabled;
        state.alarmSound = d.alarmSound ?? state.alarmSound;
        state.dayStartHour = d.dayStartHour ?? state.dayStartHour;
      }
      const dayDoc = await db.collection('users').doc(uid).collection('days').doc(dateKey()).get();
      if(dayDoc.exists){
        const d = dayDoc.data();
        state.consumedMl = d.consumedMl ?? 0;
        state.log = d.log ?? [];
        state.failCount = d.failCount ?? 0;
      } else {
        state.consumedMl = 0; state.log = []; state.failCount = 0;
      }
    }catch(e){
      console.error('클라우드 불러오기 실패', e);
    }finally{
      state.syncing = false;
      render();
    }
  }

  async function openHistory(){
    state.historyOpen = true;
    render();
    if(!state.user || !firebaseReady) return;
    try{
      const db = firebase.firestore();
      const snap = await db.collection('users').doc(state.user.uid).collection('days')
        .orderBy('date','desc').limit(14).get();
      state.history = snap.docs.map(doc => doc.data());
      render();
    }catch(e){
      console.error('기록 불러오기 실패', e);
    }
  }

  // 로그인 상태가 바뀔 때마다: 로그인 → 클라우드에서 불러오기 / 로그아웃 → 게스트 로컬 저장값으로 복귀
  if(firebaseReady){
    firebase.auth().onAuthStateChanged(async (user)=>{
      state.user = user;
      state.authReady = true;
      if(user){
        await loadFromCloud();
      } else {
        loadPersisted();
        render();
      }
    });
  }

  // ---------- clock ----------
  // 사용자가 어떤 언어를 쓰든, 실제로는 한국 내 산업 현장에 있는 근로자이므로
  // 화면 언어와 무관하게 항상 "근무지 기준 시간(한국 표준시)"을 보여준다.
  // (이전에는 언어별로 다른 시간대를 보여줬으나, 정의되지 않은 언어에서 조용히 한국시간으로
  //  fallback되는 버그가 있었고, 애초에 "언어별 시간대"라는 컨셉 자체가 실제 사용 맥락과
  //  맞지 않아 문제의 근본 원인을 없애는 방향으로 통일했다.)
  const CLOCK_TIMEZONE = 'Asia/Seoul';
  const CLOCK_LABEL = 'KST';
  function updateClock(){
    const el = document.getElementById('clockDisplay');
    if(!el) return;
    const now = new Date();
    // 언어와 무관하게 항상 영문 AM/PM 표기로 통일해서 표시
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: CLOCK_TIMEZONE, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
    }).formatToParts(now);
    const get = type => parts.find(p=>p.type===type).value;
    let h = parseInt(get('hour'), 10);
    const m = get('minute');
    const s = get('second');
    const ampm = h < 12 ? 'AM' : 'PM';
    h = h % 12; if(h === 0) h = 12;
    const hh = String(h).padStart(2,'0');
    el.textContent = `${hh}:${m}:${s} ${ampm} ${CLOCK_LABEL}`;
  }
  setInterval(updateClock, 1000);

  loadPersisted();
  render();
  updateClock();
})();
</script>
