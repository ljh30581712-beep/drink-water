<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Water-Cycle · 실측 대시보드 (소유자 전용)</title>
<style>
  :root{ --teal:#0E9C8C; --navy:#0D1319; --panel:#141C24; --panel2:#1A232C; --line:#2A3540; --text:#E7EEF2; --dim:#8FA3AE; --amber:#FFB627; --red:#F87171; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--navy); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif; padding:24px 16px; }
  .wrap{ max-width:860px; margin:0 auto; }
  h1{ font-size:20px; margin:0 0 4px; }
  .sub{ color:var(--dim); font-size:13px; margin-bottom:18px; line-height:1.6; }
  button{ background:var(--teal); color:#06231f; border:0; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; font-size:14px; }
  button.ghost{ background:var(--panel2); color:var(--text); border:1px solid var(--line); }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  .card h2{ font-size:14px; color:var(--teal); margin:0 0 10px; }
  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .stat{ background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; }
  .stat .n{ font-size:26px; font-weight:800; color:var(--teal); }
  .stat .l{ font-size:11px; color:var(--dim); margin-top:2px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; }
  th{ color:var(--dim); font-weight:600; font-size:12px; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .note{ font-size:12px; color:var(--dim); line-height:1.6; margin-top:8px; }
  .warn{ color:var(--amber); }
  .err{ color:var(--red); font-size:13px; margin-top:8px; }
  .bar{ height:8px; border-radius:6px; background:var(--panel2); overflow:hidden; margin-top:6px; }
  .bar > div{ height:100%; background:var(--teal); }
  @media(max-width:600px){ .grid{ grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Water-Cycle 실측 대시보드</h1>
  <div class="sub">앱이 직접 기록한 4개 이벤트(방문·시작·완료·재방문)로 계산합니다. 팀원·심사용 접속(internal)은 제외됩니다.<br>소유자 구글 계정으로 로그인해야 보입니다.</div>

  <div id="loginBox" class="card">
    <button id="btnLogin">Google 로그인</button>
    <div id="msg" class="err"></div>
  </div>

  <div id="dash" style="display:none;">
    <div class="card">
      <h2>① 계측 이벤트 — 실제 기록 현황 (고유 사용자 수)</h2>
      <div class="grid" id="evGrid"></div>
      <div class="note" id="evNote"></div>
    </div>

    <div class="card">
      <h2>② 퍼널 — 단계별 인원과 이탈률</h2>
      <table id="funnel"></table>
    </div>

    <div class="card">
      <h2>③ 리텐션</h2>
      <table id="ret"></table>
      <div class="note" id="retNote"></div>
    </div>

    <div class="card">
      <h2>⑤ 북극성 지표 — 최근 7일간 음수 인증에 성공한 사용자</h2>
      <div style="font-size:28px; font-weight:800; color:var(--teal);" id="ns"></div>
      <div class="bar"><div id="nsBar" style="width:0%"></div></div>
      <div class="note" id="nsNote"></div>
    </div>

    <div class="card">
      <h2>일자별 현황</h2>
      <table id="daily"></table>
    </div>
    <button class="ghost" id="btnReload">새로고침</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDi0OOVgGxItHEGATw1qgOvU10y5wxzyjU",
  authDomain: "water-cycle-381dd.firebaseapp.com",
  projectId: "water-cycle-381dd",
  storageBucket: "water-cycle-381dd.firebasestorage.app",
  messagingSenderId: "500263893719",
  appId: "1:500263893719:web:f66bea58fc8f965aaece92",
};
firebase.initializeApp(firebaseConfig);
const $ = id => document.getElementById(id);
const NORTH_STAR_TARGET = 10; // W1에서 정한 8주 뒤 목표치

function dayNum(s){ const [y,m,d] = s.split('-').map(Number); return Math.floor(Date.UTC(y,m-1,d) / 86400000); }
function pct(a,b){ return b ? (a/b*100).toFixed(1) + '%' : '-'; }
function kstToday(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }

$('btnLogin').onclick = async () => {
  try{ await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch(e){ $('msg').textContent = '로그인 실패: ' + e.message; }
};
$('btnReload').onclick = load;
firebase.auth().onAuthStateChanged(u => { if(u){ $('loginBox').style.display='none'; $('dash').style.display='block'; load(); } });

async function load(){
  $('msg').textContent = '';
  let docs;
  try{
    const snap = await firebase.firestore().collection('events').limit(20000).get();
    docs = snap.docs.map(d => d.data());
  }catch(e){
    $('dash').style.display='none'; $('loginBox').style.display='block';
    $('msg').textContent = '데이터를 읽을 수 없습니다. Firestore 보안 규칙에 소유자 이메일이 등록돼 있는지 확인하세요. (' + e.code + ')';
    return;
  }
  const ev = docs.filter(e => !e.internal && e.anonId && e.type && e.day);
  const sets = { visit:new Set(), start:new Set(), complete:new Set(), return:new Set() };
  const daysByUser = {};
  const daily = {};
  ev.forEach(e => {
    if(sets[e.type]) sets[e.type].add(e.anonId);
    (daysByUser[e.anonId] = daysByUser[e.anonId] || new Set()).add(e.day);
    const dd = daily[e.day] = daily[e.day] || { visit:new Set(), start:new Set(), complete:new Set() };
    if(dd[e.type]) dd[e.type].add(e.anonId);
  });
  const allUsers = Object.keys(daysByUser);

  // ① 이벤트 현황
  const labels = { visit:'방문', start:'시작', complete:'완료', return:'재방문' };
  $('evGrid').innerHTML = Object.keys(labels).map(k => `<div class="stat"><div class="n">${sets[k].size}</div><div class="l">${labels[k]} (${k})</div></div>`).join('');
  $('evNote').textContent = `외부 사용자 이벤트 ${ev.length}건 기록됨 · 제외된 팀/심사용 이벤트 ${docs.length - ev.length}건`;

  // ② 퍼널
  const steps = [['방문(링크를 열었다)', sets.visit.size], ['시작(촬영을 시도했다)', sets.start.size], ['완료(AI 인증에 성공했다)', sets.complete.size], ['재방문(다른 날 다시 왔다)', sets.return.size]];
  let h = '<tr><th>단계</th><th class="num">인원</th><th class="num">직전 단계 대비</th><th class="num">이탈률</th></tr>';
  steps.forEach((s,i) => {
    const prev = i ? steps[i-1][1] : null;
    h += `<tr><td>${s[0]}</td><td class="num">${s[1]}</td><td class="num">${prev===null?'-':pct(s[1],prev)}</td><td class="num">${prev===null?'-':pct(Math.max(prev-s[1],0),prev)}</td></tr>`;
  });
  $('funnel').innerHTML = h;

  // ③ 리텐션
  const allDays = ev.map(e => dayNum(e.day));
  if(!allDays.length){ $('ret').innerHTML = '<tr><td>아직 데이터가 없습니다.</td></tr>'; }
  else {
    const d0 = Math.min(...allDays), dN = Math.max(...allDays);
    const span = dN - d0 + 1;
    const multi = allUsers.filter(u => daysByUser[u].size >= 2).length;
    let cohort = 0, kept = 0;
    allUsers.forEach(u => {
      const ds = [...daysByUser[u]].map(dayNum);
      const first = Math.min(...ds);
      if(first - d0 < 7){ cohort++; if(ds.some(x => x - d0 >= 7 && x - d0 < 14)) kept++; }
    });
    const haveWeek2 = span >= 8;
    $('ret').innerHTML =
      `<tr><th>지표</th><th class="num">분자</th><th class="num">분모</th><th class="num">비율</th></tr>` +
      `<tr><td>다른 날 다시 온 사용자 / 전체 사용자</td><td class="num">${multi}</td><td class="num">${allUsers.length}</td><td class="num">${pct(multi,allUsers.length)}</td></tr>` +
      `<tr><td>1주차 사용자 중 2주차에도 온 사용자</td><td class="num">${haveWeek2?kept:'-'}</td><td class="num">${cohort}</td><td class="num">${haveWeek2?pct(kept,cohort):'데이터 부족'}</td></tr>`;
    $('retNote').innerHTML = `데이터 기간: ${span}일 (첫 기록일부터 오늘까지) ` + (haveWeek2 ? '' : '<span class="warn">· 1주차→2주차 리텐션은 데이터가 8일 이상 쌓여야 계산됩니다.</span>');
  }

  // ⑤ 북극성: 최근 7일 완료자
  const today = dayNum(kstToday());
  const ns = new Set(ev.filter(e => e.type==='complete' && today - dayNum(e.day) <= 6).map(e => e.anonId)).size;
  $('ns').textContent = `${ns}명 / 목표 ${NORTH_STAR_TARGET}명 (${pct(ns, NORTH_STAR_TARGET)})`;
  $('nsBar').style.width = Math.min(100, ns / NORTH_STAR_TARGET * 100) + '%';
  $('nsNote').textContent = '기준: 최근 7일 안에 AI 인증에 1회 이상 성공한 외부 사용자(고유 ID 기준). 설문 응답과는 별개의 앱 자체 기록입니다.';

  // 일자별
  const days = Object.keys(daily).sort();
  $('daily').innerHTML = '<tr><th>날짜</th><th class="num">방문</th><th class="num">시작</th><th class="num">완료</th></tr>' +
    days.map(d => `<tr><td>${d}</td><td class="num">${daily[d].visit.size}</td><td class="num">${daily[d].start.size}</td><td class="num">${daily[d].complete.size}</td></tr>`).join('');
}
</script>
</body>
</html>
